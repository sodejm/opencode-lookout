name: Bug report
description: Report a reproducible Lookout problem using sanitized evidence.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the private security reporting link instead. Never paste credentials, global config, or raw terminal logs."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OpenCode and Node versions, Lookout commit, OS, terminal, theme, and dimensions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Prefer an isolated example with synthetic resources.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Recovery and sanitized evidence
      description: Does external unload help? Include only short, redacted excerpts.
