name: Feature request
description: Describe a problem and a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Note any configuration, security, or compatibility implications.
    validations:
      required: true
