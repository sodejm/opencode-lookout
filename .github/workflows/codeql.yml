name: CodeQL Advanced
on:
  push:
    # Push/dispatch scans assess the complete candidate, not only PR changes.
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "20 12 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    # Only full scans may supply the protected branch's required Analyze checks.
    name: ${{ github.event_name == 'pull_request' && 'PR Analyze' || 'Analyze' }} (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The existing CodeQL workflow uploads security results, not release artifacts.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - name: Analyze and upload security results
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/lookout-sarif
          upload-database: false
      - name: Reject every finding and analysis error
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/lookout-sarif
        run: node scripts/check-codeql.mjs "$SARIF_DIRECTORY"
