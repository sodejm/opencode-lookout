name: Publish npm (manual)
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact maintainer-approved commit (dispatch its published release tag)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'sodejm/opencode-lookout' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm install --global --ignore-scripts npm@11.20.0
      - name: Check exact release and fresh hosted evidence
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: node scripts/npm-publish-check.mjs
      - run: npm ci --ignore-scripts
      - run: bash scripts/install-ci-scanners.sh
      - run: actionlint
      - run: npm run security
      - run: npm run test:compatibility
      - run: npm run release:check
      - name: Test the exact artifact installed by Docker
        run: |
          node test/packed.mjs .build/npm-artifact/opencode-lookout-*.tgz
          node scripts/check-package-evidence.mjs .build/npm-artifact/opencode-lookout-*.tgz
      - name: Recheck hosted evidence immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: node scripts/npm-publish-check.mjs
      - name: Publish tested artifact with OIDC provenance
        run: npm publish .build/npm-artifact/opencode-lookout-*.tgz --ignore-scripts --access public --provenance --registry=https://registry.npmjs.org/
